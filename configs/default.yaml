project:
  name: semantic_comm
  output_root: outputs
  experiment: default
seed: 42
device: auto

dataset:
  name: cifar10
  root: data
  image_size: 32
  num_workers: 2
  val_ratio: 0.1
  batch_size: 64
  pin_memory: false

model:
  in_channels: 3
  latent_dim: 128
  base_channels: 32
  num_classes: 10
  enable_recon: true
  enable_cls: true
  channel:
    type: awgn
    snr_db: 15.0
    dropout_p: 0.05
    bandwidth_ratio: 1.0

training:
  epochs: 5
  lr: 0.001
  weight_decay: 0.0001
  cls_loss_weight: 1.0
  recon_loss_weight: 1.0
  grad_clip: 1.0
  save_every: 1

partition:
  mode: auto
  manual_point: p1
  latency_budget_ms: 80
  bandwidth_budget_kb: 32
  edge_compute_budget: 0.4

deployment:
  export_path: outputs/export
  quantized_path: outputs/quantized
  benchmark_warmup: 10
  benchmark_iters: 50
  consistency_threshold: 0.02

service:
  host: 127.0.0.1
  cloud_port: 9000
  edge_port: 9001
  timeout_s: 10
